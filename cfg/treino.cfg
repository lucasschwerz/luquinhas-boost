sv_cheats "1"                                  // ativa cheats no servidor (necessário para noclip, host_timescale etc.)
mp_autoteambalance "0"                         // desliga o balanceamento automático de times (ninguém é movido de time sozinho)
mp_limitteams "0"                              // remove o limite de diferença de jogadores entre os times (0 = sem limite)
mp_maxmoney "60000"                            // dinheiro máximo que cada jogador pode ter (o padrão é 16000)
mp_startmoney 60000                            // dinheiro com que o jogador começa a partida/rodada de reinício
mp_buy_anywhere "1"                            // permite comprar em qualquer lugar do mapa, fora da zona de compra
bind "x" noclip                                // tecla X liga/desliga o noclip (voar atravessando paredes)
bind "h" "sv_rethrow_last_grenade"             // tecla H rearremessa a última granada que você jogou, igual à anterior
bind "j" "incrementvar host_timescale 1 11 10" // tecla J aumenta a velocidade do jogo de 1 até 11 em passos de 10 (ver nota abaixo)
bot_stop "1"                                   // congela os bots: eles ficam parados e não atiram nem se movem
mp_restartgame "1"                             // reinicia a partida em 1 segundo, aplicando as configurações acima