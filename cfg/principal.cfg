// ===== HUD =====
hud_scaling "1.00"                  // tamanho da HUD (1.00 = escala máxima)
cl_showloadout 1                    // mostra sempre as armas/itens do inventário na HUD
safezonex 1.0                       // margem horizontal da HUD (1.0 = usa a largura toda da tela, sem margem)
safezoney 1.0                       // margem vertical da HUD (1.0 = usa a altura toda da tela, sem margem)
hud_showtargetid "1"                // mostra o nome do jogador em que você está mirando
cl_allow_animated_avatars "0"       // desativa avatares animados dos jogadores
r_show_build_info "0"               // esconde a mensagem com a versão/build do jogo na tela
cl_hud_color "11"                   // cor da HUD (cada número é uma cor; 0 = padrão)
fps_max "0"                         // limite de FPS (0 = sem limite)
r_fullscreen_gamma 2.2              // gamma do jogo (2.2 = padrão; valores menores deixam a imagem mais clara)

// ===== RADAR =====
cl_hud_radar_scale 1.0              // tamanho do radar na tela
cl_radar_scale 0.35                 // zoom do mapa dentro do radar (menor = mostra mais área do mapa)
cl_radar_always_centered 1          // radar sempre centralizado em você (0 = move conforme o mapa)
cl_radar_rotate 1                   // radar gira junto com a sua mira (0 = norte fixo)
cl_radar_icon_scale_min 0.8         // tamanho mínimo dos ícones dos jogadores no radar

// ===== VIEWMODEL =====
viewmodel_fov 68                    // campo de visão da arma na tela (maior = arma mais afastada/menor)
viewmodel_offset_x 2.5              // posição da arma na horizontal (positivo = mais para a direita)
viewmodel_offset_y 0                // posição da arma para frente/trás
viewmodel_offset_z -1.5             // posição da arma na vertical (negativo = mais baixa)
viewmodel_presetpos 2               // preset de posição da arma (1 = desktop, 2 = couch, 3 = classic)

// ===== MOUSE =====
sensitivity "1.272727"              // sensibilidade do mouse no jogo
zoom_sensitivity_ratio "1.0"        // multiplicador da sensibilidade com mira de zoom (AWP, scout, rifles com luneta)

// ===== OUTROS =====
con_enable "true"                   // habilita o console do jogo
mm_dedicated_search_maxping "35"    // ping máximo dos servidores na busca de partida (matchmaking)
cl_teamid_overhead_colors_show "1"  // mostra a cor de cada companheiro acima da cabeça
cl_teammate_colors_show "1"         // mostra as cores do time no radar e no placar
cl_dm_buyrandomweapons "0"          // no Mata-Mata, não dá armas aleatórias (você escolhe a sua)
cl_silencer_mode "0"                // controla a remoção do silenciador; 0 evita tirar sem querer

// ===== BINDS =====
bind "`" "toggleconsole"            // tecla ` abre/fecha o console
bind "c" "slot10"                   // tecla C puxa a molotov/incendiária
bind "4" "slot4"                    // tecla 4 puxa a HE
bind "z" "slot8"                    // tecla Z puxa a smoke
bind "mouse4" "slot7"               // botão lateral do mouse (mouse4) puxa a flash
bind "mouse5" "toggle cl_radar_scale 1 0.4"  // botão lateral (mouse5) alterna o zoom do radar entre 1 e 0.4

// ===== MOVIMENTAÇÃO =====
bind mwheelup +jump                 // rolar a roda do mouse para cima pula (bhop)
bind mwheeldown +jump               // rolar a roda do mouse para baixo pula (bhop)

host_writeconfig                    // salva as configurações atuais no arquivo de config
clear                               // limpa o texto do console
