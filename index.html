<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Luquinhas Boost</title>
<style>
:root{--bg:#0a0a0a;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.075);--tx:#ffffff;--mu:#8c8c8c;--ac:#a855f7;--ac2:#7c3aed;--ac3:#d8b4fe;--acrgb:168,85,247;--ac2rgb:124,58,237;--hr:0deg;--onac:#fff;--ok:#34d399;--hov:rgba(255,255,255,.04);--hov2:rgba(255,255,255,.025);--alt:rgba(255,255,255,.07);--sw:#3a3354;--inset:rgba(0,0,0,.28);--elev:#0a0a0a;--shadow:#0008}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--tx);font:14px 'Segoe UI Variable','Segoe UI',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(650px 420px at 88% -8%,rgba(var(--ac2rgb),.25),transparent),radial-gradient(520px 420px at -5% 105%,rgba(var(--acrgb),.12),transparent)}

#ind{position:absolute;left:-14px;top:0;width:3px;height:22px;border-radius:3px;background:var(--ac);box-shadow:0 0 14px var(--ac);transition:transform .4s cubic-bezier(.3,1.2,.4,1)}

.btn{border:0;border-radius:10px;padding:11px 20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac,#fff);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.2s;position:relative}

.sw.ld{pointer-events:none}.sw.ld::after{right:auto!important;top:3px!important;margin:0!important;left:12px!important;width:17px;height:17px;box-sizing:border-box;background:none;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;transition:none;animation:sp .7s linear infinite}

.search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:0;margin-bottom:12px;transition:.2s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tw{display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative;overflow:hidden}.tw.busy::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:40%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:bar 1.1s ease-in-out infinite}@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}.state.wait{color:var(--mu)}
.tr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.tags{display:flex;gap:6px;flex-wrap:wrap}
.star{color:#fbbf24;font-style:normal}.tw p{margin:0;color:var(--mu);font-size:13px;flex:1}.state{color:var(--ok);font-size:12px;font-style:normal;height:14px}
.list{border-radius:14px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-top:1px solid var(--line);transition:.2s}
.row:first-child{border:0}.row:hover{background:var(--hov2)}.row b{display:block}.row small{color:var(--mu)}
.bar{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.three{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.three .card{display:flex;flex-direction:column;gap:10px}.three p{margin:0;color:var(--mu);flex:1}

.av{width:38px;height:38px;border-radius:10px;background:rgba(var(--acrgb),.16);color:var(--ac3);display:grid;place-items:center;font-weight:700;flex:none}
.apc b{display:block;font-size:13.5px;overflow-wrap:anywhere}.apc small{color:var(--mu)}.apc>div:last-child{min-width:0}
.big{grid-column:1/-1;color:var(--mu);padding:30px;text-align:center}

.sm{font-size:12.5px;margin:6px 0 14px}
.pre{margin:14px 0 0;padding:14px;max-height:240px;overflow:auto;border-radius:10px;background:var(--inset);border:1px solid var(--line);color:var(--mu);font:12px/1.5 Consolas,monospace;white-space:pre-wrap}

.fld{display:flex;align-items:center;gap:10px;margin:0 0 6px}.fld label{color:var(--mu);font-size:12.5px;white-space:nowrap}

::selection{background:rgba(var(--acrgb),.35)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card:hover{background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(var(--acrgb),.14),transparent 70%),var(--card)}
.btn{overflow:hidden}.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
.btn:hover::before{transform:translateX(130%)}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease}

.kc{min-width:84px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--inset);color:var(--ac3);font:600 12.5px Consolas,monospace;text-align:center;cursor:pointer;transition:.2s}
.kc:hover{border-color:var(--ac)}.kc.cap{border-color:var(--ac);color:#fff;background:rgba(var(--acrgb),.25);animation:pl2 1s ease-in-out infinite}
@keyframes pl2{50%{box-shadow:0 0 0 4px rgba(var(--acrgb),.18)}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 28px;margin:14px 0 8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.fld label{min-width:104px}
.warn.adm{display:flex;justify-content:space-between;align-items:center;gap:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.inf{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:8px;border-radius:50%;border:1.5px solid var(--mu);color:var(--mu);font:italic 700 10px Georgia,serif;cursor:help;vertical-align:1px;transition:.2s}
.inf:hover{border-color:var(--ac);color:var(--ac)}
#tip{position:fixed;z-index:120;display:none;max-width:300px;padding:10px 14px;border-radius:10px;background:var(--elev);border:1px solid rgba(var(--acrgb),.4);color:var(--tx);font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);transition:.18s;box-shadow:0 8px 30px var(--shadow)}
#tip.on{opacity:1;transform:none}
.thm{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:6px}
.wheel{position:relative;width:170px;height:170px;border-radius:50%;flex:none;cursor:crosshair;touch-action:none;user-select:none;background:radial-gradient(circle closest-side,hsl(0 0% 62%),transparent),conic-gradient(hsl(0 100% 65%),hsl(60 100% 65%),hsl(120 100% 65%),hsl(180 100% 65%),hsl(240 100% 65%),hsl(300 100% 65%),hsl(360 100% 65%));box-shadow:0 0 0 1px var(--line),0 10px 30px -10px rgba(var(--acrgb),.5)}
.thumb{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #000a;transform:translate(-50%,-50%);pointer-events:none}
.sws{display:flex;gap:10px;flex-wrap:wrap}.swc{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s;padding:0}.swc:hover{transform:scale(1.15);border-color:#fff}
html[data-mode=light]{--bg:#f3f0fa;--card:rgba(255,255,255,.85);--line:rgba(40,25,80,.12);--tx:#1b1530;--mu:#6d6585;--hov:rgba(40,25,80,.05);--hov2:rgba(40,25,80,.035);--alt:rgba(40,25,80,.08);--sw:#cfc7e2;--inset:rgba(40,25,80,.06);--elev:#fff;--shadow:#2a1f5a33;--ok:#0f9d6e}

.tw.fps{background:rgba(var(--acrgb),.09);border-color:rgba(var(--acrgb),.28)}

.tw.fps.on:hover{background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(var(--acrgb),.3),transparent 70%),rgba(var(--acrgb),.2)}
.fpsb{background:rgba(var(--acrgb),.3);color:var(--tx)}
.lgd{display:flex;gap:18px;align-items:center;margin:0 0 14px;color:var(--mu);font-size:12.5px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);margin-right:6px;vertical-align:-2px}.lg.f{background:rgba(var(--acrgb),.3);border-color:rgba(var(--acrgb),.6)}
.lang{position:fixed;top:0;right:146px;height:36px;display:flex;align-items:center;z-index:7;-webkit-app-region:no-drag}

.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin:0 0 16px}
.sg{border:0;border-radius:9px;padding:8px 16px;background:none;color:var(--mu);font:inherit;cursor:pointer;transition:.2s}.sg:hover{color:var(--tx)}.sg.on{background:var(--ac);color:var(--onac,#fff)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}

.bd{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.bd.ok{background:rgba(52,211,153,.16);color:var(--ok)}.bd.warn{background:rgba(251,191,36,.18);color:#d99a06}.bd.unk{background:var(--alt);color:var(--mu)}

.md{display:flex;gap:10px;margin-top:10px}.md .btn.sel{outline:2px solid var(--ac);outline-offset:2px}

.spw{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center}

async function loadApps(){if(S.appTab==='hub')return loadHub();if(S.appTab==='bl')return loadBloat();if(!S.appList){S.appList=await api.appsList();S.sel=new Set()}appGrid()}
async function loadBloat(){if(!S.bloat){S.bloat=await api.bloatList();S.selB=new Set()}bloatGrid()}
function bloatGrid(){if(page!=='apps'||S.appTab!=='bl')return;const g=$('#blgrid');if(!g)return;$('#ap-sub').textContent=tf('Navegue e remova {0} apps pré-instalados',S.bloat.length);
 g.innerHTML=S.bloat.length?S.bloat.map((b,i)=>`<div class="card apc bl st ${S.selB.has(b.id)?'on':''}" data-bl="${b.id}" style="--i:${Math.min(i,10)}"><div class="ck"></div><div class="av">${esc(b.n[0].toUpperCase())}</div><div class="api"><b>${esc(b.n)}</b><small>${esc(b.d)}</small></div></div>`).join(''):'<div class="big">Nenhum bloatware encontrado. Seu Windows está limpo!</div>';i18n(g);selUp()}
async function loadHealth(){if(!S.health)S.health=await api.health();if(page!=='health')return;const{mem,gpu}=S.health,it=[];
 let x;if(mem.xmp==='on')x=['ok','Ativado',tf('Memória {0} rodando a {1} MHz (capacidade do pente: {2} MHz).',mem.type||'RAM',mem.running,mem.rated)];
 else if(mem.xmp==='off')x=['warn','Desativado',tf('Sua memória está rodando a {0} MHz, mas o pente suporta até {1} MHz. Ative o XMP (Intel) ou EXPO/DOCP (AMD) na BIOS para ganhar FPS.',mem.running,mem.rated)];
 else if(mem.xmp==='jedec')x=['unk','Padrão',tf('Sua memória roda a {0} MHz, que é a velocidade padrão. Se o seu kit anuncia mais que isso, ative o XMP/EXPO na BIOS.',mem.running)];
 else x=['unk','Não identificado','Não foi possível ler a velocidade da memória.'];
 it.push(['Memória RAM (XMP / EXPO)',...x,'Estimativa: o Windows não informa o XMP diretamente, então comparamos a velocidade atual com a do pente.']);
 if(mem.count===1)it.push(['Canais da memória','warn','Canal único',tf('Você tem só 1 pente de memória ({0} GB). Com 2 pentes iguais o PC usa canal duplo e rende mais FPS.',mem.gb),'']);
 else if(mem.count>1)it.push(['Canais da memória','ok','Provável canal duplo',tf('{0} pentes detectados ({1} GB no total). Confira se estão nos slots certos (normalmente A2 e B2) para valer o canal duplo.',mem.count,mem.gb),'']);
 else it.push(['Canais da memória','unk','Não identificado','Não foi possível ler a velocidade da memória.','']);
 const gn=gpu.name||'GPU';let r;
 if(gpu.state==='on')r=['ok','Ativado',tf('Resizable BAR ativo na {0}.',gn)];
 else if(gpu.state==='off')r=['warn','Desativado',tf('Resizable BAR desligado na {0}. Ative "Above 4G Decoding" e "Resizable BAR" na BIOS. O ganho no CS2 costuma ser pequeno.',gn)];
 else if(gpu.state==='none')r=['unk','Sem placa dedicada','Não encontrei uma placa de vídeo dedicada neste PC.'];
 else r=['unk','Não detectável',gpu.vendor==='nvidia'?'Não consegui ler pelo driver da NVIDIA. Veja no GPU-Z (campo Resizable BAR).':tf('Não detectei automaticamente na {0}. Veja no AMD Software (Desempenho → Smart Access Memory).',gn)];
 it.push(['Resizable BAR',...r,'']);
 const ok=it.filter(v=>v[1]==='ok').length;
 $('#hbody').innerHTML=`<div class="hgrid">${it.map((v,i)=>`<div class="card st hc" style="--i:${i}"><div class="top"><h3>${tr(v[0])}</h3><span class="bd ${v[1]}">${tr(v[2])}</span></div><p>${esc(v[3])}</p>${v[4]?`<small>${tr(v[4])}</small>`:''}</div>`).join('')}</div><p class="mu" style="margin-top:14px">${tf('{0} de {1} itens estão ok',ok,it.length)}${gpu.name?' · '+tf('Placa de vídeo: {0} · Driver {1}',gpu.name,gpu.driver||'—'):''}</p>`}
function appGrid(){if(page!=='apps'||S.appTab==='bl'||S.appTab==='hub'||!$('#aq'))return;const q=($('#aq').value||'').toLowerCase(),l=S.appList.filter(a=>a.n.toLowerCase().includes(q));
 $('#ap-sub').textContent=tf('Navegue e gerencie {0} aplicativos instalados',S.appList.length);
 const g=$('#apgrid');g.innerHTML=l.map((a,i)=>`<div class="card apc st ${S.sel.has(a.id)?'on':''}" data-ap="${a.id}" style="--i:${Math.min(i,10)}"><div class="ck"></div><div class="av">${esc(a.n[0].toUpperCase())}</div><div class="api"><b>${esc(a.n)}</b><small>${esc([a.p,a.v].filter(Boolean).join(' · ')||'—')}</small></div>${a.s?`<span class="apz">${a.s>=1024?(a.s/1024).toFixed(1)+' GB':a.s+' MB'}</span>`:''}</div>`).join('')||'<div class="big">Nenhum app encontrado.</div>';i18n(g);selUp()}
function selUp(){const p=$('#ap-sel');if(!p)return;const n=S.appTab==='bl'?(S.selB?S.selB.size:0):(S.sel?S.sel.size:0);p.textContent=tf('{0} selecionados',n);p.classList.toggle('on',n>0)}
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;grid()}if(e.target.id==='aq')appGrid();if(e.target.id==='cfgname'||e.target.id==='lcfg'){S.cfgName=e.target.value.replace(/[^\w-]/g,'');savePrefs();for(const i of['cfgname','lcfg']){const f=$('#'+i);if(f&&f!==e.target&&f.value!==S.cfgName)f.value=S.cfgName}const m=$('#cmd');if(m)m.innerHTML=launchHtml()}if(e.target.id==='tname'){S.tName=e.target.value.replace(/[^\w-]/g,'');savePrefs();const x=$('#tex');if(x)x.textContent='exec '+(tname()||'nomedacfg')}if(e.target.id==='sens'){S.sens=e.target.value.replace(',','.').replace(/[^\d.]/g,'');savePrefs();prev()}});
document.addEventListener('click',async e=>{const c=s=>e.target.closest(s);let el;
 if(el=c('#langbtn')){$('#langmenu').classList.toggle('on');return}
 if(el=c('[data-lang]')){S.lang=el.dataset.lang;savePrefs();renderLang();renderNav();renderWarn();go(page);return}
 if(!c('.lang'))$('#langmenu').classList.remove('on');
 if(!c('.mdd')){const d=$('#mdd');if(d)d.classList.remove('open')}
 if(el=c('.nv'))return go(el.dataset.p);
 if(el=c('.chip')){S.cat=el.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===el));return grid()}
 if(el=c('.sw[data-id]'))return toggleTweak(el);
 if(el=c('.sw[data-cl]')){el.classList.toggle('on');const i=el.dataset.cl;cl.has(i)?cl.delete(i):cl.add(i);return}
 if(el=c('#doclean')||c('#cleanall')){const all=el.id==='cleanall',ids=all?CLEAN.map(x=>x[0]):[...cl];if(!ids.length)return toast('Selecione ao menos uma opção.','err');if(all&&!confirm('Limpar tudo, incluindo a Lixeira? Os arquivos da Lixeira serão apagados definitivamente.'))return;return busy(el,async()=>{const r=await api.clean(ids);S.lastClean=Date.now();const ok=Object.values(r).filter(Boolean).length;toast(tf('{0} de {1} limpezas concluídas',ok,ids.length),ok<ids.length?'err':'');cl.clear();S.cscan=null;go('clean')})}
 if(el=c('#rec'))return applyRecommended(el);
 if(el=c('[data-r]'))return busy(el,async()=>{const a=el.dataset.r,ok=await api.restore(a);if(a==='revert')S.applied.clear();toast(ok?(a==='create'?'Ponto criado!':a==='revert'?'Ajustes revertidos':'Abrindo...'):'Não foi possível (o Windows limita 1 ponto a cada 24h).',ok?'':'err');if(a==='revert')go('rest')});
 if(el=c('.sw[data-opt]')){stopCap();const k=el.dataset.opt;S.opts[k]=S.opts[k]===false;savePrefs();$('#xopts').innerHTML=xoptsHtml();i18n($('#xopts'));return prev()}
 if(el=c('#mtrig')){$('#mdd').classList.toggle('open');return}
 if(el=c('[data-mira]')){S.mira=el.dataset.mira;savePrefs();$('#miras').innerHTML=mirasHtml();return i18n($('#miras'))}
 if(el=c('.kc'))return startCap(el);
 if(el=c('#bdef')){S.binds={...DEF_B};S.opts={...DEF_O};S.sens='1.272727';savePrefs();return go('cs2')}
 if(el=c('[data-copy]')){const k=el.dataset.copy;let t;if(k==='launch')t=launch();else if(k==='cross')t=miraCur()[2];else{await cfgData();t=k==='cfg:principal'?buildCfg():buildTreino()}await api.copy(t);return toast('Copiado!')}
 if(el=c('#tdef')){S.tbinds={...DEF_T};S.tName='treino';savePrefs();return go('cs2')}
 if(el=c('[data-th]')){const [a,b]=el.dataset.th.split(',').map(Number);S.theme={...S.theme,h:a,s:b};applyTheme(S.theme);thumbPos();savePrefs();return syncBar()}
 if(el=c('#thr')){S.theme={...DEF_THEME,mode:S.theme.mode};applyTheme(S.theme);thumbPos();savePrefs();return syncBar()}
 if(el=c('[data-ci]')||c('#cfgall')){await cfgData();const ids=el.id==='cfgall'?['principal','treino']:[el.dataset.ci],files=[];
  if(ids.includes('principal')){const n=cname();if(!n)return toast('Escreva o nome da config principal antes de instalar.','err');files.push({name:n,text:buildCfg()})}
  if(ids.includes('treino')){const n=tname();if(!n)return toast('Escreva o nome da config de treino antes de instalar.','err');files.push({name:n,text:buildTreino()})}
  if(files.length>1&&files[0].name===files[1].name)return toast('Use nomes diferentes para as duas configs.','err');
  if(!confirm(tf('Instalar {0} na pasta do CS2? Se já existir um arquivo com o mesmo nome, ele será substituído.',files.map(f=>f.name+'.cfg').join(', '))))return;
  return busy(el,async()=>{const r=await api.cs2Install(files);if(r.ok)toast(files.length>1?'Configs instaladas!':'Config instalada!');else if(!r.cancel)toast('Não foi possível instalar. Escolha a pasta game\\csgo\\cfg.','err')})}
 if(el=c('#upd'))return openUpdater();
 if(el=c('#elev'))return busy(el,async()=>{const ok=await api.elevate();if(!ok)toast('Permissão de administrador não concedida.','err')});
 if(el=c('[data-tab]')){S.appTab=el.dataset.tab;return go('apps')}
 if(el=c('[data-bl]')){const i=el.dataset.bl;S.selB.has(i)?S.selB.delete(i):S.selB.add(i);el.classList.toggle('on');return selUp()}
 if(el=c('#blall')){S.bloat.forEach(b=>S.selB.add(b.id));return bloatGrid()}
 if(el=c('#blrm')){if(!S.selB||!S.selB.size)return toast('Marque ao menos um app.','err');if(!confirm(tf('Remover {0} app(s) pré-instalado(s)? Você pode reinstalar depois pela Microsoft Store.',S.selB.size)))return;return busy(el,async()=>{const r=await api.bloatRemove([...S.selB]);const ok=Object.values(r).filter(Boolean).length;toast(tf('{0} de {1} removidos',ok,S.selB.size),ok<S.selB.size?'err':'');S.bloat=null;go('apps')})}
 if(el=c('#hrf')){S.health=null;return go('health')}
 if(el=c('[data-tm]')){S.theme={...S.theme,mode:el.dataset.tm};applyTheme(S.theme);savePrefs();syncBar();return go('cfg')}
 if(el=c('.apc')){const i=+el.dataset.ap;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);el.classList.toggle('on');return selUp()}
 if(el=c('#un')){if(!S.sel.size)return toast('Marque ao menos um app.','err');if(!confirm(tf('Desinstalar {0} app(s)?',S.sel.size)))return;return busy(el,async()=>{const r=await api.appsUninstall([...S.sel]);const ok=Object.values(r).filter(Boolean).length;toast(tf('{0} de {1} desinstalados',ok,S.sel.size),ok<S.sel.size?'err':'');S.appList=null;go('apps')})}
 if(el=c('#ex'))return busy(el,async()=>{toast(await api.appsExport([...S.sel])?'Lista salva!':'Cancelado.')});
 if(el=c('#dc'))return api.link();
});
applyTheme(themeFromStore());
(async()=>{S=await api.init();S.applied=new Set(S.applied);S.cat='Todos';S.q='';loadPrefs();applyTheme(S.theme);syncBar();document.title=S.brand;
 renderNav();renderLang();
 renderWarn();ui2Init();
 S.upAt=Date.now();$('#ver').textContent='V.'+S.ver;go('home');setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),700)},Math.max(500,2500-(Date.now()-(window.__t0||0))));api.update().then(u=>{if(u){S.upd=u;renderWarn()}})})();
</script><script src="ui2.js"></script></body></html>
