<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Luquinhas Boost</title>
<style>

::selection{background:rgba(var(--acrgb),.35)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card:hover{background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(var(--acrgb),.14),transparent 70%),var(--card)}
.btn{overflow:hidden}.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
.btn:hover::before{transform:translateX(130%)}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease}

.kc{min-width:84px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ac3);font:600 12.5px Consolas,monospace;text-align:center;cursor:pointer;transition:.2s}
.kc:hover{border-color:var(--ac)}.kc.cap{border-color:var(--ac);color:#fff;background:rgba(var(--acrgb),.25);animation:pl2 1s ease-in-out infinite}
@keyframes pl2{50%{box-shadow:0 0 0 4px rgba(var(--acrgb),.18)}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 28px;margin:14px 0 8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.fld label{min-width:104px}
.warn.adm{display:flex;justify-content:space-between;align-items:center;gap:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.inf{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:8px;border-radius:50%;border:1.5px solid var(--mu);color:var(--mu);font:italic 700 10px Georgia,serif;cursor:help;vertical-align:1px;transition:.2s}
.inf:hover{border-color:var(--ac);color:var(--ac)}
#tip{position:fixed;z-index:120;display:none;max-width:300px;padding:10px 14px;border-radius:10px;background:#16102a;border:1px solid rgba(var(--acrgb),.4);color:var(--tx);font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);transition:.18s;box-shadow:0 8px 30px #0008}
#tip.on{opacity:1;transform:none}
.thm{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:6px}
.wheel{position:relative;width:170px;height:170px;border-radius:50%;flex:none;cursor:crosshair;touch-action:none;user-select:none;background:radial-gradient(circle closest-side,hsl(0 0% 62%),transparent),conic-gradient(hsl(0 100% 65%),hsl(60 100% 65%),hsl(120 100% 65%),hsl(180 100% 65%),hsl(240 100% 65%),hsl(300 100% 65%),hsl(360 100% 65%));box-shadow:0 0 0 1px var(--line),0 10px 30px -10px rgba(var(--acrgb),.5)}

.sws{display:flex;gap:10px;flex-wrap:wrap}.swc{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s;padding:0}.swc:hover{transform:scale(1.15);border-color:#fff}
</style></head><body><div class="bg"></div><div class="drag"></div><div id="splash"><img src="logo-wide.svg"></div>

<script>

const NAV=[['home','Painel','home'],['opt','Otimizações','bolt'],['cs2','CS2','cs'],['clean','Limpeza','trash'],['rest','Restauração','shield'],['apps','Apps','box'],['cfg','Configurações','sl']];
const CLEAN=[['temp','Limpar Arquivos Temporários','Remover arquivos temporários do sistema e do usuário.','Apaga arquivos temporários criados por programas e pelo Windows (pastas Temp do usuário e do sistema). É seguro: o Windows recria o que precisar, e arquivos em uso são ignorados.'],['prefetch','Limpar Arquivos Prefetch','Excluir a pasta Prefetch (o Windows recria sozinho).','Apaga a pasta Prefetch, que guarda dados para abrir programas mais rápido. O Windows recria sozinho, mas a primeira abertura de cada programa pode ficar um pouco mais lenta.'],['bin','Esvaziar Lixeira (Perigoso)','Remove permanentemente os arquivos da Lixeira.','Esvazia a Lixeira de todos os discos. Os arquivos são apagados definitivamente e não dá para recuperar.'],['wu','Limpar Cache do Windows Update','Remover instaladores baixados do Windows Update.','Apaga os instaladores de atualizações já baixados pelo Windows Update. Libera espaço, e o Windows baixa de novo se precisar.'],['thumbs','Limpar Cache de Miniaturas','Remover miniaturas em cache do Explorador de Arquivos.','Apaga o cache de miniaturas do Explorador de Arquivos. As imagens são recriadas conforme você abre as pastas.']];

const DEF_B={console:'`',molotov:'c',he:'4',smoke:'z',flash:'mouse4',radar:'mouse5',voice:'v',jumpup:'mwheelup',jumpdown:'mwheeldown'};

  if(ids.includes('treino')){const n=tname();if(!n)return toast('Escreva o nome da config de treino antes de instalar.','err');files.push({name:n,text:buildTreino()})}
  if(files.length>1&&files[0].name===files[1].name)return toast('Use nomes diferentes para as duas configs.','err');
  if(!confirm('Instalar '+files.map(f=>f.name+'.cfg').join(' e ')+' na pasta do CS2? Se já existir um arquivo com o mesmo nome, ele será substituído.'))return;
  return busy(el,async()=>{const r=await api.cs2Install(files);if(r.ok)toast(files.length>1?'Configs instaladas!':'Config instalada!');else if(!r.cancel)toast('Não foi possível instalar. Escolha a pasta game\\csgo\\cfg.','err')})}
 if(el=c('#upd'))return api.open(S.upd.url);
 if(el=c('#elev'))return busy(el,async()=>{const ok=await api.elevate();if(!ok)toast('Permissão de administrador não concedida.','err')});
 if(el=c('.apc')){const i=+el.dataset.ap;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);el.classList.toggle('on');return selUp()}
 if(el=c('#un')){if(!S.sel.size)return toast('Marque ao menos um app.','err');if(!confirm(`Desinstalar ${S.sel.size} app(s)?`))return;return busy(el,async()=>{const r=await api.appsUninstall([...S.sel]);const ok=Object.values(r).filter(Boolean).length;toast(`${ok} de ${S.sel.size} desinstalados`,ok<S.sel.size?'err':'');S.appList=null;go('apps')})}
 if(el=c('#ex'))return busy(el,async()=>{toast(await api.appsExport([...S.sel])?'Lista salva!':'Cancelado.')});
 if(el=c('#dc'))return api.link();
});
applyTheme(themeFromStore());
(async()=>{S=await api.init();S.applied=new Set(S.applied);S.cat='Todos';S.q='';loadPrefs();applyTheme(S.theme);syncBar();document.title=S.brand;
 $('#nav').innerHTML='<span id="ind"></span>'+NAV.map(([p,l,i])=>`<button class="nv" data-p="${p}">${i==='cs'?'<span class="cs2i"></span>':ico(i)}${l}</button>`).join('');
 if(!S.admin)$('#warn').innerHTML='<div class="warn adm"><span>Alguns ajustes e limpezas precisam de permissão de administrador.</span><button class="btn" id="elev">Reiniciar como administrador</button></div>';
 $('#ver').textContent='v'+S.ver;go('home');setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),700)},700);api.update().then(u=>{if(u){S.upd=u;$('#warn').insertAdjacentHTML('beforeend',`<div class="warn upd"><span>Nova versão <b>${esc(u.v)}</b> disponível!</span><button class="btn" id="upd">Baixar atualização</button></div>`)}})})();
</script></body></html>
